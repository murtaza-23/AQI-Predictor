name: Daily AQI Model Training

permissions:
  contents: write

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install hops-deltalake confluent-kafka

      - name: Train model
        run: |
          python training_pipeline/train.py

      - name: Commit training artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add training_pipeline/models/best_model.pkl
          git add training_pipeline/models/metrics.txt || true
          git add training_pipeline/models/metrics.json || true
          git add training_pipeline/plots/*.png || true

          if git diff --cached --quiet; then
            echo "No training artifact changes — skipping commit."
          else
            git commit -m "model: update daily training results [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Artifacts committed and pushed."
          fi